<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Commercial office architectural planning and interior fit-out, Prayagraj — photo pending">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <defs>
    <pattern id="gridOff" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#gridOff)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Commercial Office wireframe illustration -->
  <rect x="180" y="90" width="240" height="180" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <line x1="240" y1="90" x2="240" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="300" y1="90" x2="300" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="360" y1="90" x2="360" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="180" y1="135" x2="420" y2="135" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="180" y1="180" x2="420" y2="180" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="180" y1="225" x2="420" y2="225" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Commercial glass entry facade -->
  <rect x="270" y="225" width="60" height="45" fill="#CBD5E1" stroke="#1E293B" stroke-width="2"/>

  <!-- Badge & Text -->
  <rect x="130" y="300" width="340" height="32" rx="4" fill="#C25E2E"/>
  <text x="300" y="321" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">[PROJECT PHOTO PENDING CLIENT UPLOAD]</text>
  <text x="300" y="355" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Commercial Office Fit-Out &amp; Elevation | Prayagraj</text>
</svg>
