<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Educational school building architectural design, Prayagraj — photo pending">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <defs>
    <pattern id="gridInst" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#gridInst)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Educational / Institutional building wireframe -->
  <polygon points="300,90 440,140 160,140" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <rect x="180" y="140" width="240" height="120" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <!-- Classical columns -->
  <rect x="200" y="140" width="16" height="120" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
  <rect x="245" y="140" width="16" height="120" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
  <rect x="339" y="140" width="16" height="120" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
  <rect x="384" y="140" width="16" height="120" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
  <rect x="280" y="190" width="40" height="70" fill="#94A3B8" stroke="#1E293B" stroke-width="2"/>
  <line x1="150" y1="260" x2="450" y2="260" stroke="#1E293B" stroke-width="3"/>

  <!-- Badge & Text -->
  <rect x="130" y="300" width="340" height="32" rx="4" fill="#C25E2E"/>
  <text x="300" y="321" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">[PROJECT PHOTO PENDING CLIENT UPLOAD]</text>
  <text x="300" y="355" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Educational Complex &amp; Institutional Design | Prayagraj</text>
