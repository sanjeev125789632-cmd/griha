<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Ar. Chandan Singh (Chandan Singh Bhartiya) - Founder Portrait Placeholder">
  <rect width="100%" height="100%" fill="#F1F5F9"/>
  <!-- Subtle drafting grid background -->
  <defs>
    <pattern id="portraitGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#portraitGrid)"/>
  <rect x="20" y="20" width="360" height="460" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Stylized architect silhouette -->
  <circle cx="200" cy="180" r="55" fill="#CBD5E1"/>
  <path d="M120 330 C120 250, 280 250, 280 330 Z" fill="#94A3B8"/>
  <rect x="180" y="300" width="40" height="70" fill="#64748B" rx="2"/>
  <!-- Status Badge -->
  <rect x="50" y="375" width="300" height="34" rx="4" fill="#C25E2E"/>
  <text x="200" y="397" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">[FOUNDER PHOTO PENDING CLIENT UPLOAD]</text>
  <text x="200" y="430" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Ar. Chandan Singh (Chandan Singh Bhartiya)</text>
  <text x="200" y="448" font-family="system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Principal Architect | Griha Architects Prayagraj</text>
</svg>
