<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Griha Architects Logo">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25E2E"/>
      <stop offset="100%" stop-color="#8F3F1A"/>
    </linearGradient>
  </defs>
  <!-- Architectural Icon: Modern stylized gable & precision drafting grid -->
  <g transform="translate(4, 6)">
    <!-- Base foundation bar -->
    <rect x="2" y="44" width="46" height="4" rx="2" fill="#1E293B"/>
    <!-- Outer roof / structure lines -->
    <path d="M4 40 L25 8 L46 40" fill="none" stroke="url(#terracottaGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner architectural vault & drafting line -->
    <path d="M15 40 L25 24 L35 40" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Drafting precision vertex point -->
    <circle cx="25" cy="8" r="3.5" fill="#C25E2E"/>
    <circle cx="25" cy="24" r="2" fill="#1E293B"/>
  </g>
  <!-- Text Branding -->
  <text x="64" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#0F172A">GRIHA</text>
  <text x="162" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="300" letter-spacing="2" fill="#C25E2E">ARCHITECTS</text>
  <text x="65" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.8" fill="#64748B">PLANNING • INTERIORS • PRAYAGRAJ</text>
</svg>
