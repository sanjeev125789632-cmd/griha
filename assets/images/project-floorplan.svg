<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Duplex residential villa 2D floor plan and municipal map, Prayagraj — photo pending">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <defs>
    <pattern id="gridPlan" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#gridPlan)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Architectural 2D blueprint layout -->
  <rect x="150" y="80" width="300" height="190" fill="#F1F5F9" stroke="#1E293B" stroke-width="3"/>
  <line x1="280" y1="80" x2="280" y2="270" stroke="#1E293B" stroke-width="2.5"/>
  <line x1="150" y1="180" x2="280" y2="180" stroke="#1E293B" stroke-width="2"/>
  <line x1="280" y1="160" x2="450" y2="160" stroke="#1E293B" stroke-width="2"/>
  <!-- Room labels -->
  <text x="210" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">LIVING ROOM</text>
  <text x="210" y="230" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">KITCHEN</text>
  <text x="365" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">BEDROOM 01</text>
  <text x="365" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">MASTER SUITE</text>
  <!-- Dimension ticks -->
  <line x1="140" y1="80" x2="140" y2="270" stroke="#C25E2E" stroke-width="1.5"/>
  <line x1="135" y1="80" x2="145" y2="80" stroke="#C25E2E" stroke-width="1.5"/>
  <line x1="135" y1="270" x2="145" y2="270" stroke="#C25E2E" stroke-width="1.5"/>

  <!-- Badge & Text -->
  <rect x="130" y="300" width="340" height="32" rx="4" fill="#C25E2E"/>
  <text x="300" y="321" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">[PROJECT PHOTO PENDING CLIENT UPLOAD]</text>
  <text x="300" y="355" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">2D Floor Plan &amp; Municipal Map Sanction | Prayagraj</text>
</svg>
