<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Modular kitchen design and living room interior, Prayagraj — photo pending">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <defs>
    <pattern id="gridKitch" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#gridKitch)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Modular Kitchen wireframe illustration -->
  <rect x="150" y="100" width="300" height="60" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <line x1="250" y1="100" x2="250" y2="160" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="350" y1="100" x2="350" y2="160" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="150" y="190" width="300" height="80" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  <line x1="225" y1="190" x2="225" y2="270" stroke="#64748B" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="300" y2="270" stroke="#64748B" stroke-width="1.5"/>
  <line x1="375" y1="190" x2="375" y2="270" stroke="#64748B" stroke-width="1.5"/>
  <!-- Chimney / Hob -->
  <polygon points="270,140 330,140 340,165 260,165" fill="#94A3B8"/>
  <rect x="275" y="190" width="50" height="8" fill="#1E293B"/>

  <!-- Badge & Text -->
  <rect x="130" y="300" width="340" height="32" rx="4" fill="#C25E2E"/>
  <text x="300" y="321" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">[PROJECT PHOTO PENDING CLIENT UPLOAD]</text>
  <text x="300" y="355" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Modern Modular Kitchen &amp; Living Interior | Prayagraj</text>
</svg>