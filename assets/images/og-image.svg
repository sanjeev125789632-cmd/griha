  <text x="680" y="295" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#C25E2E" letter-spacing="1.5">ARCHITECTURE &amp; INTERIOR DESIGN</text>
  <text x="680" y="345" font-family="system-ui, sans-serif" font-size="20" fill="#CBD5E1">Civil Lines, Prayagraj, Uttar Pradesh</text>
  <text x="680" y="390" font-family="system-ui, sans-serif" font-size="18" fill="#94A3B8">Ar. Chandan Singh (Chandan Singh Bhartiya)</text>
  
  <rect x="680" y="430" width="360" height="50" rx="6" fill="#C25E2E"/>
  <text x="860" y="462" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Phone / WhatsApp: +91 93692 13111</text>
